<!DOCTYPE html>
<!-- Informa que estamos usando HTML5 -->

<html lang="pt-br">
<!-- Inicia o documento HTML e define o idioma como português do Brasil -->

<head>
    <!-- Contém as configurações e informações da página -->

    <title>Biografia</title>
    <!-- Define o nome que aparece na aba do navegador -->

    <meta charset="UTF-8">
    <!-- Permite usar caracteres como ã, ç, é, etc. -->

    <meta name="description" content="Biografia de Gabriel Pietro">
    <!-- Define uma descrição da página -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz a página se adaptar a celulares e outros dispositivos -->

</head>

<body>
    <!-- Inicia a parte visível da página -->

    <h1>Gabriel Pietro</h1>
    <!-- Cria o título principal da página -->

    <p>
        Sou estudante do SESI em Mococa, tenho 16 anos e sou jovem aprendiz do SENAI.
    </p>
    <!-- Cria um parágrafo com informações sobre mim -->


    <!-- Imagem do Santos exibida na página -->
    <img src="santos.png" alt="Santos">
    <!--
        <img> = adiciona uma imagem
        src = indica o nome/local do arquivo da imagem
        alt = texto alternativo da imagem
    -->


    <ul>
        <!-- Cria uma lista não ordenada -->

        <li>Gosto de jogar truco</li>
        <!-- Primeiro item da lista -->

        <li>Assistir filmes</li>
        <!-- Segundo item da lista -->

        <li>Jogar videogame</li>
        <!-- Terceiro item da lista -->

    </ul>


    <a href="https://github.com/gabrielpsilva15-creator/Atividadegit" target="_blank">
        Meu GitHub
    </a>
    <!--
        <a> = cria um link
        href = endereço para onde o link leva
        target="_blank" = abre o link em uma nova aba
    -->

</body>
<!-- Fecha o conteúdo visível da página -->

</html>
<!-- Fecha o documento HTML -->
