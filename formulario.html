<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section>
        <h2>Formulário</h2>
        <forn action="formulario.html" method="post">
            <p> <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br><br>
            </p>
            <p>
                <label for="email">senha:</label>
                <input type="password" id="password" name="password" required><br><br>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>

              <p>  <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"
                placeholder="00-00000-0000" required title="use o formato 00-00000-0000"><br><br>
                <p><label for="cep">cep:</label><br>
                <textarea id="cep" name="cep" rows="4" cols="50" required></textarea><br><br>
            </p>
            <input type="submit" value="Enviar">

            <p><label>sobre você:</label></p>
            <textarea name="sobre" rows="4" cols="50" required></textarea><br><br>
            </p>
            <p><label for="genero">Gênero:</label>
                <input type="radio" name="genero" value="m">masculino
                <input type="radio" name="genero" value="f">feminino
            </p>
            <p><label>interesses:</label></p>
            <input type="checkbox" name="interesses" value="tecnologia">tecnologia
            <input type="checkbox" name="interesses" value="esportes">esportes
            <input type="checkbox" name="interesses" value="artes">artes
            </p>
    </section>
</body>

</html>
